<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone Assistant</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e3e1db;
  --me: #1f4fd1; --me-ink: #ffffff; --accent: #1f4fd1;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141413; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9890; --line: #33322f;
          --me: #3b6cf0; --me-ink: #ffffff; --accent: #7fa0ff; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
       display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line);
         background: var(--panel); padding-top: max(12px, env(safe-area-inset-top)); }
header h1 { font-size: 17px; margin: 0; flex: 1; }
header button { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
                padding: 6px 10px; font: inherit; font-size: 14px; }
#facts { display: none; padding: 10px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line);
         background: var(--panel); }
#facts.open { display: block; }
#facts ul { margin: 0; padding-left: 18px; }
main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
#chips button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
                padding: 7px 12px; font: inherit; font-size: 14px; }
form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel);
       padding-bottom: max(10px, env(safe-area-inset-bottom)); }
textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
           background: var(--bg); color: var(--ink); font: inherit; max-height: 120px; }
form button { border: 0; border-radius: 12px; padding: 0 16px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
form button:disabled { opacity: .5; }
.bot code { font-family: ui-monospace, monospace; font-size: 14px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
.empty { color: var(--muted); text-align: center; margin: auto 0; font-size: 15px; }
</style>
</head>
<body>
<header>
  <h1>Phone Assistant <span style="font-weight:400;color:var(--muted);font-size:13px">· offline</span></h1>
  <button id="infoBtn" type="button">Phone info</button>
  <button id="newBtn" type="button">New chat</button>
</header>
<div id="facts"><ul id="factList"></ul></div>
<main id="log"><p class="empty" id="empty">Ask anything about your phone, like battery, storage, settings, or how to do something.<br>Runs on-device with Qwen3.5-4B.</p></main>
<div id="chips">
  <button type="button">How much storage do I have left?</button>
  <button type="button">How do I take a scrolling screenshot?</button>
  <button type="button">What's my battery level?</button>
  <button type="button">How do I turn on battery protection?</button>
</div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Ask about your phone…" enterkeyhint="send"></textarea>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"),
      send = document.getElementById("send"), chips = document.getElementById("chips");
let busy = false;

function render(el, text) {
  // Minimal Markdown: escape first, then **bold**, `code`, and "- " bullets.
  const esc = text.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  el.innerHTML = esc.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
                    .replace(/^(\s*)[-*] /gm, "$1• ");
}

function bubble(cls, text) {
  document.getElementById("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls; el.textContent = text;
  log.appendChild(el); log.scrollTop = log.scrollHeight;
  return el;
}

async function loadFacts(facts) {
  if (!facts) facts = (await (await fetch("/api/phone")).json()).facts;
  const ul = document.getElementById("factList"); ul.innerHTML = "";
  for (const f of facts) { const li = document.createElement("li"); li.textContent = f; ul.appendChild(li); }
}

async function ask(text) {
  if (busy || !text.trim()) return;
  busy = true; send.disabled = true; chips.style.display = "none";
  bubble("me", text);
  const bot = bubble("bot typing", "");
  let answer = "";
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ message: text }) });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line) continue;
        const msg = JSON.parse(line);
        if (msg.text) { answer += msg.text; render(bot, answer.trimStart()); log.scrollTop = log.scrollHeight; }
        if (msg.done) {
          const d = msg.done, meta = document.createElement("div"); meta.className = "meta";
          meta.textContent = d.error ? "Error: " + d.error :
            `${d.generated_tokens} tokens · ${d.decode_tps.toFixed(1)} tok/s` + (d.restarted ? " · memory was full, earlier turns dropped" : "");
          bot.appendChild(meta);
        }
      }
    }
  } catch (e) {
    bot.textContent = answer || "Couldn't reach the engine: " + e.message;
  }
  bot.classList.remove("typing");
  busy = false; send.disabled = false; input.focus();
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault(); const t = input.value; input.value = ""; input.style.height = ""; ask(t);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = ""; input.style.height = input.scrollHeight + "px"; });
chips.addEventListener("click", e => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
document.getElementById("infoBtn").addEventListener("click", () => {
  document.getElementById("facts").classList.toggle("open"); loadFacts();
});
document.getElementById("newBtn").addEventListener("click", async () => {
  if (busy) return;
  busy = true; send.disabled = true;
  log.innerHTML = '<p class="empty" id="empty">Starting a new chat and refreshing phone info…</p>';
  const r = await (await fetch("/api/reset", { method: "POST", body: "{}" })).json();
  loadFacts(r.facts);
  document.getElementById("empty").textContent = "New chat. Phone info refreshed.";
  chips.style.display = ""; busy = false; send.disabled = false;
});
</script>
</body>
</html>
