name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to ghcr.io (off by default; pushes, tags and pull requests only build)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/turbo-tan/tqllm

jobs:
  # Builds the Docker image natively on x86-64 and arm64 runners.
  # The Dockerfile picks CUDA architectures per platform (86;89;120 / 121).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space (CUDA images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push per-arch image)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}-${{ matrix.arch }}
          build-args: BUILD_JOBS=4
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Combines the two per-arch images into one multi-platform tag,
  # e.g. ghcr.io/turbo-tan/tqllm:beta-<sha>-cu13
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=beta-,suffix=-cu13
            type=ref,event=tag
            type=raw,value=beta,enable={{is_default_branch}}

      - name: Create multi-platform tags
        run: |
          args=""
          for t in $(echo "${{ steps.meta.outputs.tags }}"); do args="$args -t $t"; done
          docker buildx imagetools create $args \
            ${{ env.IMAGE }}:ci-${{ github.sha }}-amd64 \
            ${{ env.IMAGE }}:ci-${{ github.sha }}-arm64
