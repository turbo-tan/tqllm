name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/turbo-tan/tqllm
  HUB_IMAGE: docker.io/ytan2000/tqllm

# Images are published only for a v* tag (vX.Y.Z -> X.Y.Z, X.Y.Z-cu13 and latest on ghcr.io and Docker Hub);
# pushes to main, pull requests and manual runs only build. Run the GPU smoke tests before pushing the tag.

jobs:
  # Builds the Docker image natively on x86-64 and arm64 runners.
  # The Dockerfile picks CUDA architectures per platform (86;89;120 / 121).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space (CUDA images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push per-arch image)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}-${{ matrix.arch }}
          build-args: BUILD_JOBS=4
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Combines the two per-arch images into one multi-platform tag on both registries,
  # e.g. ghcr.io/turbo-tan/tqllm:1.0.1 and ytan2000/tqllm:1.0.1
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.HUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},suffix=-cu13
            type=raw,value=latest

      - name: Create multi-platform tags
        run: |
          args=""
          for t in $(echo "${{ steps.meta.outputs.tags }}"); do args="$args -t $t"; done
          docker buildx imagetools create $args \
            ${{ env.IMAGE }}:ci-${{ github.sha }}-amd64 \
            ${{ env.IMAGE }}:ci-${{ github.sha }}-arm64
