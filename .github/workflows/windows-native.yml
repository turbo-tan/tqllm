name: windows-native

# Native Windows build of tqserve (MSVC + CUDA, no WSL): compile only, the runners have no GPU.
on:
  push:
    branches: [ci/windows-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: CUDA toolkit 13.1 (NVIDIA redistributable archives, as llama.cpp's Windows CI)
        shell: pwsh
        run: |
          $root = "C:\cuda"; New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = "https://developer.download.nvidia.com/compute/cuda/redist"
          $parts = @(
            "cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.1.80-archive.zip",
            "cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.1.80-archive.zip",
            "cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.1.80-archive.zip",
            "cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-13.1.80-archive.zip",
            "libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.1.80-archive.zip",
            "cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-13.1.78-archive.zip",
            "libcublas/windows-x86_64/libcublas-windows-x86_64-13.2.0.9-archive.zip",
            "libcusolver/windows-x86_64/libcusolver-windows-x86_64-12.0.7.41-archive.zip",
            "libcusparse/windows-x86_64/libcusparse-windows-x86_64-12.7.2.19-archive.zip",
            "libnvjitlink/windows-x86_64/libnvjitlink-windows-x86_64-13.1.80-archive.zip",
            "cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-13.1.68-archive.zip",
            "cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-13.1.80-archive.zip")
          foreach ($p in $parts) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $p -Leaf)
            Invoke-WebRequest -Uri "$base/$p" -OutFile $zip
            $tmp = Join-Path $env:RUNNER_TEMP "x"; Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
            Expand-Archive $zip -DestinationPath $tmp
            Copy-Item -Recurse -Force (Join-Path (Get-ChildItem $tmp)[0].FullName "*") $root
          }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDAToolkit_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$root\bin\nvcc.exe" --version
      - name: Ninja
        run: choco install ninja -y
      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=86 -DCMAKE_CUDA_COMPILER=C:/cuda/bin/nvcc.exe > configure.log 2>&1 & type configure.log
      - name: Build tqserve
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build --target tqserve -j 4 -- -k 0 > build.log 2>&1
          set RC=%ERRORLEVEL%
          findstr /R /C:"error" build.log > errors.txt
          type errors.txt
          exit /b %RC%
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: |
            configure.log
            build.log
            errors.txt
