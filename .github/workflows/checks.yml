name: checks

# Required on every pull request to main: CPU build (no CUDA), ctest, Python tests.
# GPU tests and the decode-speed guard run on self-hosted GPU runners (separate workflow).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: cpu build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests/test_no_private_paths.py reads git ls-files

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake g++ python3-numpy

      - name: Configure (CPU only)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTQLLM_CUDA=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: ctest
        run: ctest --test-dir build --output-on-failure -j 4
