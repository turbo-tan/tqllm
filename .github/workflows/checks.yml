name: checks

# Required on every pull request to main: CPU build (no CUDA), ctest, Python tests.
# GPU tests (ctest label gpu) do not run here: GitHub runners have no GPU. Run `ctest -L gpu` on a CUDA card before a PR
# (CONTRIBUTING.md, "GPU tests run locally, not in CI").

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: cpu build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests/test_no_private_paths.py reads git ls-files

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake g++ python3-numpy

      - name: Configure (CPU only)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTQLLM_CUDA=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: ctest
        run: ctest --test-dir build --output-on-failure -j 4

  monitor-browser:
    name: monitor / Chromium, Firefox, WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build the monitor fixture (CPU only)
        run: |
          cmake -S . -B build-monitor -DTQLLM_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-monitor --target test-monitor -j 2
      # the browsers and their system libraries come with the Playwright image: `playwright install --with-deps` on the
      # runner stalled on its apt mirror (gstreamer1.0-plugins-bad) until the job timed out, three runs in a row
      - name: Browser regression gate (no model or GPU)
        run: |
          docker run --rm --ipc=host -v "$PWD:/w" -w /w mcr.microsoft.com/playwright/python:v1.64.0-noble bash -c \
            "pip install -q --break-system-packages playwright==1.64.0 && python3 tests/test_monitor_ui.py --binary build-monitor/test-monitor --output build-monitor/monitor-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-browser-artifacts
          path: build-monitor/monitor-artifacts
          if-no-files-found: ignore
          retention-days: 7
