name: checks

# Required on every pull request to main: CPU build (no CUDA), ctest, Python tests.
# GPU tests and the decode-speed guard run on self-hosted GPU runners (separate workflow).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: cpu build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests/test_no_private_paths.py reads git ls-files

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake g++ python3-numpy

      - name: Configure (CPU only)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTQLLM_CUDA=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: ctest
        run: ctest --test-dir build --output-on-failure -j 4

  monitor-browser:
    name: monitor / Chromium, Firefox, WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build the monitor fixture (CPU only)
        run: |
          cmake -S . -B build-monitor -DTQLLM_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-monitor --target test-monitor -j 2
      - name: Install contributor browser tooling
        run: |
          python3 -m venv .venv-monitor
          .venv-monitor/bin/pip install playwright==1.64.0
          .venv-monitor/bin/python -m playwright install --with-deps chromium firefox webkit
      - name: Browser regression gate (no model or GPU)
        run: .venv-monitor/bin/python tests/test_monitor_ui.py --binary build-monitor/test-monitor --output build-monitor/monitor-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-browser-artifacts
          path: build-monitor/monitor-artifacts
          if-no-files-found: ignore
          retention-days: 7
