name: macos

# Also builds the Linux wheels (PyPI trusts this file as the publisher of tqllm).

# Prebuilt tqLLM for Apple Silicon Macs on macOS 26: the tqllm wheel (tqserve inside, built against PyPI's MLX) plus the
# PyPI wheels it needs, as one tar for tqllm.com/install.sh. Runs on GitHub's Apple Silicon runner; no model is served
# here (the release test with real models runs on our Mac).
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/macos.yml', 'pyproject.toml', 'python/**', 'src/backends/metal/**', 'CMakeLists.txt']
  workflow_dispatch:
    inputs:
      ref:
        description: tag or commit to build (e.g. v1.8.0)
        required: true
      publish:
        description: upload the wheel to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prebuilt:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Build the tqllm wheel
        run: |
          python -m venv bv && bv/bin/pip install -q "mlx==0.32.4" "scikit-build-core>=0.10" cmake ninja wheel
          C=$(git rev-parse --short=7 HEAD 2>/dev/null) || C=${GITHUB_SHA::7}
          CMAKE_ARGS="-DTQLLM_COMMIT=$C" bv/bin/pip wheel --no-build-isolation --no-deps . -w out
          W=$(ls out/tqllm-*.whl)
          case "$W" in *py3-none-macosx_26_0_arm64.whl) ;; *) bv/bin/python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag macosx_26_0_arm64 "$W" ;; esac
          ls -la out
      - name: Dependency wheels (Python 3.10-3.13)
        run: |
          for py in 3.10 3.11 3.12 3.13; do
            bv/bin/pip download -q --only-binary=:all: --platform macosx_26_0_arm64 --python-version $py \
              "mlx==0.32.4" "huggingface_hub>=0.24" -d wheels
          done
          cp out/tqllm-*.whl wheels/ && ls wheels
      - name: Install test (fresh venv, local wheels only)
        run: |
          python -m venv iv && iv/bin/pip install -q --no-index --find-links wheels "tqllm[mlx]==${{ steps.v.outputs.version }}"
          iv/bin/tqllm --help | head -3
          T=$(ls iv/lib/python3.12/site-packages/tqllm/bin/tqserve) && otool -L "$T" | grep -i mlx
          "$T" --help | head -3
      - name: Tar
        run: |
          T=tqllm-${{ steps.v.outputs.version }}-macos26-arm64.tar
          tar cf "$T" wheels && shasum -a 256 "$T" | tee "$T.sha256" && ls -la "$T"
      - uses: actions/upload-artifact@v4
        with:
          name: tqllm-${{ steps.v.outputs.version }}-macos26-arm64
          path: tqllm-*-macos26-arm64.tar*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel
          path: out/tqllm-*.whl

  # Linux wheels: CUDA 13 tqserve inside the tqllm package, NVIDIA's pip packages for the CUDA libraries. Only refs that
  # carry the Linux pyproject override build them (1.8.1 on). x86_64: RTX 30 / 40 / 50 (86 runs on 89 too; compute_86 PTX
  # for newer cards). aarch64: GB10 / DGX Spark only (121a). No NCCL in the wheel: --split needs the Docker image.
  linux:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, repo: x86_64, cuda_archs: '86;120' }
          - { arch: aarch64, runner: ubuntu-24.04-arm, repo: sbsa, cuda_archs: '121' }
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_34_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: CUDA 13.0 toolkit
        run: |
          dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel9/${{ matrix.repo }}/cuda-rhel9.repo
          dnf install -y -q cuda-toolkit-13-0 && dnf clean all
      - name: Build the tqllm wheel
        env:
          CMAKE_ARGS: -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.cuda_archs }}
        run: |
          export PATH=/usr/local/cuda-13.0/bin:$PATH CUDACXX=/usr/local/cuda-13.0/bin/nvcc
          C=$(git rev-parse --short=7 HEAD 2>/dev/null) || C=${GITHUB_SHA::7}
          CMAKE_ARGS="$CMAKE_ARGS -DTQLLM_COMMIT=$C" /opt/python/cp312-cp312/bin/python -m pip wheel --no-deps . -w raw
          EX=""; for l in libcuda.so.1 libcudart.so.13 libcublas.so.13 libcublasLt.so.13 libcusolver.so.12 libcusparse.so.12 libnvJitLink.so.13; do EX="$EX --exclude $l"; done
          auditwheel repair --disable-isa-ext-check $EX -w out raw/tqllm-*.whl
          ls -la out
      - name: Size (PyPI limit 100 MB)
        run: |
          s=$(stat -c %s out/tqllm-*.whl); echo "$s bytes"; [ "$s" -lt 100000000 ]
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-linux-${{ matrix.arch }}
          path: out/tqllm-*.whl

  # PyPI: the macOS and Linux wheels (no sdist: it would try to build tqserve on the user's machine). Trusted
  # Publishing (OIDC): no token in the repo. Runs for v* tags, or on demand with publish = true.
  pypi:
    needs: [prebuilt, linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-wheel*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a re-run for a published version uploads only the missing files
