name: windows

# Windows 11 users run the same Linux image through WSL 2 GPU passthrough.
# GitHub's Windows runners can only build Windows containers, so the image itself
# is built by build.yml on Linux. This job checks what breaks on a Windows
# checkout: CRLF line endings in scripts and compose files that don't parse.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-checkout:
    name: Windows checkout checks
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Same line-ending behaviour as Git for Windows with default settings
      - name: Use Windows default line endings
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - name: Scripts that run in the container have LF line endings
        run: |
          # i/ = how git stores the file, w/ = what this Windows checkout wrote
          git ls-files --eol -- '*.sh' 'Dockerfile' 'compose*.yaml'
          bad=0
          for f in $(git ls-files -- '*.sh' 'Dockerfile' 'compose*.yaml'); do
            if grep -qI $'\r' "$f"; then
              echo "::error file=$f::CRLF line endings in a Windows checkout ($(git ls-files --eol -- "$f" | awk '{print $1, $2}')). In the container this fails with '/bin/sh^M: bad interpreter'."
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "Fix: keep the eol=lf rules in .gitattributes and run 'git add --renormalize .' to store these files with LF."
            exit 1
          fi
          echo "OK: no CRLF in container scripts"

      - name: Compose file parses (default and Windows paths)
        run: |
          docker compose version
          docker compose -f compose.yaml config --quiet
          MODEL_DIR='C:\models' MODEL_NAME=model.gguf docker compose -f compose.yaml config --quiet
          MODEL_DIR='/home/user/models' docker compose -f compose.yaml config --quiet
          echo "OK: compose.yaml parses"
