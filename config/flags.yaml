# TQLLM environment variables: the single registry (docs/FLAGS.md and src/core/flags_gen.hpp are generated from it by
# tools/gen_flags.py; ctest flags_registry checks both). Settings are command-line options (docs/CONFIG.md);
# kind: user (an override with no CLI form), debug (diagnostics), retired (removed: every tool stops and names the
# replacement).
flags:
  - name: TQLLM_MLX_CACHE_LIMIT_MIB
    kind: user
    default: "-"
    doc: "MiB: MLX buffer-cache limit for the Mac tools (default 512)"
  - name: TQLLM_MLX_PREFILL_CHUNK
    kind: user
    default: "-"
    doc: "N: prefill chunk rows for tqmlx-dflash (>= 128; 2048 is the measured best)"
  - name: TQLLM_DEBUG
    kind: debug
    default: "off"
    doc: "comma list of diagnostics: memlog (device memory per load stage), profile (spec round phases), steps (decode step timings), stageprof (eager verify, per-stage time), matvec (kernel picks), tune (load-time tuner picks), prefill (progress), draft (first draft / accept decisions), tree_chain (tree verify as a chain), sample_chain (sampled requests draft one chain instead of the token tree), tf_dump:FILE (teacher-forced argmax per prompt position), fakeq_k:N / fakeq_v:N (quantise-dequantise K / V to N bits), qsa_mass:N (27B QSA: for N sparse verify blocks, eagerly, the share of row 0's dense attention on its selected keys per layer); Flash-Next / MoE diagnostics: arena, fn_prefill_log, cpu_check, qsa_check, pf_mmq_check:N, profile_req:N, profile_decode, route_dump:FILE, pred_dump:FILE, dump_gdn:FILE, expert_profile:FILE, keep_map:FILE, moe_profile:FILE, minimax_dump:FILE, minimax_routes:FILE, stagemap (MiniMax verify-step stage map), accept (MiniMax acceptance per draft depth), dump_feats:DIR / replay_feats:DIR (DSpark drafter training rows), glm_dump, glm_no_graph, graphs (each CUDA graph cache miss with the cache size, evictions and free device memory), composite_serial (composite matrix parts one after another on the main stream instead of concurrently: A/B, same results), mtp_eager (one-token MTP draft passes eagerly instead of as captured graphs: A/B, same results), commit_overlap (opt-in: --mtp commit replay on a side stream overlapping the draft passes; same results, single slot only so far), iq4_i8_twopass (int8 prefill: IQ4_XS weights through FP16 and the quantise pass instead of straight to int8: A/B, same results), i8_nosmooth (int8 prefill without the SmoothQuant column scales on plain-basis weights: A/B), i8_alpha:X (int8 prefill SmoothQuant strength, default 0.75), i8_own_w8 (int8 weight scratch allocated on its own instead of inside the FP16 prefill scratch: A/B); Metal: no_matrix_unit (the M1-M4 paths on an M5: MLX affine weights, no tensor-op attention), no_turn_reuse (Metal: every request prefills its whole prompt; the cold arm of a turn-reuse A/B), ane_serial, ane_timing, count_nodes, dflash_rankstats, stream_group:N (a draft-ahead verify submits every N layers, default 4), nostream (one submission per forward), tree_rows:N (token-tree verify rows, 16 or 32), no_far (drafter ring window only), retr_split, retr_share, lattice_split, build_split, dump_ffn:DIR, dump_ffn_slice:N, wired_mib:N; Metal bench tools: dflash_spec_only, dflash_warm_tokens:N, draft_stages, draft_bench:N, kl_rows:K, kl_slice:N"
  - name: TQLLM_MATVEC_RULE
    kind: user
    default: "-"
    doc: "override the matvec kernel rule table (src/formats/weight/matvec_rules.hpp) per format bits: \"BITS:KERNEL[:PF],... (KERNEL legacy or split16)\", e.g. \"3:split16:2,21:legacy\" (3 TQ3, 4 TQ4, 14 IQ4N, 21 IQ3)"
  - name: TQLLM_GLM_EXPERT_SLOTS
    kind: user
    default: "0"
    doc: "GLM-5.3-Flash: keep only this many routed experts of every MoE layer resident, in a MixedExpertCache bank (0: the whole expert stack on the device). The experts a token needs are streamed from the GGUF / the packed file, so the tokens do not change; it also turns off the decode CUDA graph"
  - name: TQLLM_GLM_EXPERT_BUDGET_MB
    kind: user
    default: "banks + 25 %"
    doc: "GLM-5.3-Flash: device bytes the expert banks plus loader staging may hold. With TQLLM_GLM_EXPERT_SLOTS it caps them; on its own it turns on the shared byte-budget plan (src/experts/expert_bank_plan.hpp), which gives every MoE layer top-k slots and the rest of the bytes to the layers whose routing spreads over more experts (measured over the prompt, re-planned when it ends)"
  - name: TQLLM_GLM_EXPERTS
    kind: user
    default: "-"
    doc: "GLM-5.3-Flash: packed expert file (glm-pack-experts MODEL.gguf OUT.tqfnexp) for the expert banks: a bank miss copies the expert instead of repacking it; the engine page-locks it when it is at most half the host RAM, which also lets it prefetch (TQLLM_GLM_EXPERT_PF); a bigger file copies misses through pinned staging"
  - name: TQLLM_DEBUG_DRAFT
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=draft"
  - name: TQLLM_DFLASH
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "-md / --model-draft FILE"
  - name: TQLLM_DRAFT_D
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "tqserve --draft-max N"
  - name: TQLLM_DRAFT_VOCAB
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "--draft-vocab FILE"
  - name: TQLLM_FAKEQ_K
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=fakeq_k:N"
  - name: TQLLM_FAKEQ_V
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=fakeq_v:N"
  - name: TQLLM_IQ3_OLD
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_MATVEC_RULE=21:legacy"
  - name: TQLLM_IQ3_PF
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_MATVEC_RULE=21:split16:PF"
  - name: TQLLM_IQ4N_PF
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_MATVEC_RULE=14:split16:PF"
  - name: TQLLM_KV
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "--kv FORMAT or -ctk / -ctv"
  - name: TQLLM_KV8
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "-ctk q8 (or --kv q8)"
  - name: TQLLM_KV_K
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "-ctk / --cache-type-k"
  - name: TQLLM_KV_T4K3V
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "--kv t4k-turbo3v"
  - name: TQLLM_KV_T4KV
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "--kv t4kv"
  - name: TQLLM_KV_TQ3
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "--kv tq3"
  - name: TQLLM_KV_TURBO3_V
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "--kv q8k-turbo3v"
  - name: TQLLM_KV_V
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "-ctv / --cache-type-v"
  - name: TQLLM_LOOKUP
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "--lookup L"
  - name: TQLLM_LOOKUP_FIRST
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "--lookup-first K"
  - name: TQLLM_MATVEC_LOG
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=matvec"
  - name: TQLLM_MEMLOG
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=memlog"
  - name: TQLLM_PREFILL_BUF
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "-ub / --ubatch-size N"
  - name: TQLLM_PREFILL_PROGRESS
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=prefill"
  - name: TQLLM_PROFILE
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=profile"
  - name: TQLLM_REPEAT_LIMIT
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "tqserve --repeat-limit N"
  - name: TQLLM_STAGEPROF
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=stageprof"
  - name: TQLLM_STEP_PROF
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=steps"
  - name: TQLLM_TF_DUMP
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=tf_dump:FILE"
  - name: TQLLM_TQ3_OLD
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_MATVEC_RULE=3:legacy"
  - name: TQLLM_TQ3_TUNE_LOG
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=tune"
  - name: TQLLM_TQ4_OLD
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_MATVEC_RULE=4:legacy"
  - name: TQLLM_TQ4_TUNE_LOG
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=tune"
  - name: TQLLM_TREE
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "tree verify is on with -md; --no-tree turns it off"
  - name: TQLLM_TREE_CHAIN
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "TQLLM_DEBUG=tree_chain"
  - name: TQLLM_VRAM_MARGIN_MB
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "-fitt MiB (-fit on|off)"

  # Apple MLX backend; unset preserves the base path.
  - name: TQFN_ARENA_MB
    kind: user
    default: "-"
    doc: "MB: Flash-Next scratch arena size instead of the measured rule (the high-water mark is printed at exit)"
  - name: TQFN_CPU_MISS
    kind: user
    default: "0"
    doc: "N: compute up to N missed experts per layer call on the CPU instead of copying them to the GPU (default on small cards: min(15, cores / 2 - 1); else off)"
  - name: TQFN_DENSE_INT8
    kind: user
    default: "0"
    doc: "1 / 2: int8 activations for the dense prefill projections (per-32 / per-token scales); 0 = fp16 (exact path)"
  - name: TQFN_DRAFT_VOCAB
    kind: user
    default: "-"
    doc: "FILE: the MTP draft vocabulary (overrides the manifest's draft_vocab)"
  - name: TQFN_KV
    kind: user
    default: "-"
    doc: "KV format for Flash-Next attention (name from the KV format registry; default bf16)"
  - name: TQFN_KV_HOST
    kind: user
    default: "auto"
    doc: "auto (default): on for discrete GPUs, off on unified memory; 1 / 0 force it. On: K/V older than TQFN_KV_HOST_KEEP positions lives in host memory after a long prompt (frees VRAM for expert banks; decode copies only the selected rows)"
  - name: TQFN_KV_HOST_KEEP
    kind: user
    default: "32768"
    doc: "positions of K/V kept on the device with TQFN_KV_HOST=1"
  - name: TQFN_LAYER_SLOTS
    kind: user
    default: "-"
    doc: "comma list of expert slots per layer (overrides the packed file's .slots profile)"
  - name: TQFN_MTP_SLOTS
    kind: user
    default: "256"
    doc: "MTP expert slots (every expert when the trunk keeps every expert; 64 on small cards)"
  - name: TQFN_PREFILL_INT8
    kind: user
    default: "0"
    doc: "1 / 2: int8 activations for the layer-major expert GEMMs (per-32 / per-token scales)"
  - name: TQFN_TAIL_SKIP
    kind: user
    default: "-"
    doc: "R: in decode, skip non-resident experts ranked R-th or lower for every token of a call (approximate)"
