# TQLLM environment variables: the single registry (docs/FLAGS.md and src/flags_gen.hpp are generated from it by
# tools/gen_flags.py; ctest flags_registry checks both). Settings are command-line options (docs/CONFIG.md);
# kind: user (an override with no CLI form), debug (diagnostics), retired (removed: every tool stops and names the
# replacement).
flags:
  - name: TQLLM_MOE_FUSE_SHARED
    kind: debug
    default: "on"
    doc: "0: decode keeps the shared expert as separate dense matvecs instead of one more assignment in the routed expert launches"
  - name: TQLLM_MOE_STAGE
    kind: debug
    default: "on"
    doc: "0: --moe-host-mb decode reads host experts in place instead of copying the routed ones to a VRAM stage first (diagnostics)"
  - name: TQLLM_MOE_PROFILE
    kind: debug
    default: "-"
    doc: "FILE: write MoE routing counts per layer and expert (read by --moe-profile for --moe-host-mb); rewritten after every prefill"
  - name: TQLLM_LOG_TIMINGS
    kind: debug
    default: "on"
    doc: "0: no llama.cpp-style print_timing lines (per-request prefill / decode / total with draft acceptance, plus the 3 s n_gen pulse)"
  - name: TQLLM_DEBUG
    kind: debug
    default: "off"
    doc: "comma list of diagnostics: memlog (device memory per load stage), profile (spec round phases), steps (decode step timings), stageprof (eager verify, per-stage time), matvec (kernel picks), tune (load-time tuner picks), prefill (progress), draft (first draft / accept decisions), tree_chain (tree verify as a chain), tf_dump:FILE (teacher-forced argmax per prompt position), fakeq_k:N / fakeq_v:N (quantise-dequantise K / V to N bits)"
  - name: TQLLM_MATVEC_RULE
    kind: user
    default: "-"
    doc: "override the matvec kernel rule table (kernels/formats/matvec_rules.hpp) per format bits: \"BITS:KERNEL[:PF],... (KERNEL legacy or split16)\", e.g. \"3:split16:2,21:legacy\" (3 TQ3, 4 TQ4, 14 IQ4N, 21 IQ3)"
  - name: TQLLM_ATTN_NBUF
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "fixed behaviour (settled A/B switch removed)"
