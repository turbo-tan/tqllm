    kind: user
    default: "-"
    doc: "MB: Flash-Next scratch arena size instead of the measured rule (the high-water mark is printed at exit)"
  - name: TQFN_BF16_ACT
    kind: debug
    default: "off"
    doc: "BF16 instead of FP16 activations for the Flash-Next native projections (A/B)"
  - name: TQFN_CPU_CHECK
    kind: debug
    default: "off"
    doc: "check the CPU miss pool's int8 gate/up against fp32 and its packed-row rebuild against the GGUF"
  - name: TQFN_CPU_GGUF_ROWS
    kind: debug
    default: "off"
    doc: "debug A/B: the CPU miss pool reads GGUF rows instead of rebuilding them from the pinned packed copy"
  - name: TQFN_AUTO_KEEP_MB
    kind: debug
    default: "-"
    doc: "MB slots=auto keeps free beside the expert banks instead of the full-context attention room (small cards: 512); long prompts borrow banks"
  - name: TQFN_EXPERT_PROFILE
    kind: debug
    default: "-"
    doc: "seed the expert banks from a routing profile (tools/fn_expert_profile.py); measured no effect on the 12 GB first request (prune)"
  - name: TQFN_CPU_MISS
    kind: user
    default: "0"
    doc: "N: compute up to N missed experts per layer call on the CPU instead of copying them to the GPU (default on small cards: min(15, cores / 2 - 1); else off)"
  - name: TQFN_CPU_MISS_MAX
    kind: debug
    default: "-"
    doc: "K: at most K distinct experts per layer call on the CPU miss pool; the rest are GPU misses (small cards: 5)"
  - name: TQFN_CPU_OWNED
    kind: retired
    default: "-"
    doc: "removed"
    replaced_by: "removed: the CPU-owned eighth is a fixed rule (decode_rules.hpp cpu_owned), kept out of the GPU banks"
  - name: TQFN_CPU_REFILL
    kind: debug
    default: "off"
    doc: "refill the expert banks from the CPU pool's copies (A/B)"
  - name: TQFN_CPU_SPIN_MS
    kind: debug
    default: "2"
    doc: "ms the CPU miss workers spin before sleeping"
  - name: TQFN_DENSE_INT8
    kind: debug
    default: "0"
    doc: "1 / 2: int8 activations for the dense prefill projections (per-32 / per-token scales); 0 = fp16 (exact path)"
